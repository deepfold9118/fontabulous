[package]
name = "fontabulous"
version = "0.1.0"
edition = "2021"
description = "Fontabulous - a font manager"
license = "Apache-2.0"

[[bin]]
name = "fontabulous"
path = "src/main.rs"

[dependencies]
eframe = "0.35"
egui = "0.35"
ttf-parser = "0.25"
ab_glyph = "0.2.32"
memmap2 = "0.9"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
png = "0.18"
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
